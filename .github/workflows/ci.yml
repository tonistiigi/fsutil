name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 */6 * *' # every 6 days
  push:
    branches:
      - master
  pull_request:

env:
  DESTDIR: ./bin
  GO_VERSION: "1.26"

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - lint-golangci-cross
          - lint-gopls-cross
          - validate-generated-files
          - validate-gomod
          - validate-shfmt
    steps:
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Run
        uses: docker/bake-action@v7
        with:
          targets: ${{ matrix.target }}

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - build
          - cross
    steps:
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Run
        uses: docker/bake-action@v7
        with:
          targets: ${{ matrix.target }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.26"
          - "1.25"
        mode:
          - "root"
          - "noroot"
    env:
      GO_VERSION: ${{ matrix.go }}
    steps:
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Test
        uses: docker/bake-action@v7
        with:
          targets: test-${{ matrix.mode }}
      -
        name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          directory: ${{ env.DESTDIR }}/coverage
          flags: unit,${{ matrix.mode }},go-${{ matrix.go }}
          token: ${{ secrets.CODECOV_TOKEN }}

  bench:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode:
          - "root"
          - "noroot"
        file-size:
          - ""
          - "10000"
    env:
      BENCH_FILE_SIZE: ${{ matrix.file-size }}
    steps:
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Test
        uses: docker/bake-action@v7
        with:
          targets: bench-${{ matrix.mode }}
      -
        name: Upload benchmark results
        uses: codecov/codecov-action@v7
        with:
          directory: ${{ env.DESTDIR }}/bench
          flags: bench,${{ matrix.mode }},go-${{ env.GO_VERSION }},file-size-${{ matrix.file-size || 'default' }}
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

  test-os:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
        go:
          - "1.26"
          - "1.25"
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      -
        name: Test
        shell: bash
        run: |
          go test -coverprofile="coverage.txt" -covermode="atomic" ./...
          go tool cover -func="coverage.txt"
      -
        name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt
          env_vars: RUNNER_OS
          flags: unit,go-${{ matrix.go }}
          token: ${{ secrets.CODECOV_TOKEN }}

  test-bsd-amd64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - freebsd
          - netbsd
          - openbsd
    steps:
      -
        name: Prepare
        shell: bash
        run: |
          goVersion=$(curl --fail --silent --show-error "https://go.dev/dl/?mode=json&include=all" | jq -er --arg version "go${GO_VERSION}." '[.[] | select(.stable and (.version | startswith($version)))][0].version')
          echo "GO_VERSION=${goVersion#go}" >> "$GITHUB_ENV"
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up FreeBSD
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.5"
          envs: GO_VERSION
          custom-shell-name: bsd
          prepare: |
            set -ex
            mkdir -p /var/tmp
            chmod 1777 /var/tmp
            archive="go${GO_VERSION}.freebsd-amd64.tar.gz"
            fetch -o "/var/tmp/$archive" "https://go.dev/dl/$archive"
            tar -C /var/tmp -xzf "/var/tmp/$archive"
            pw useradd -n fsutil -m -s /bin/sh
      -
        name: Set up NetBSD
        if: matrix.os == 'netbsd'
        uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92 # v1.5.2
        with:
          release: "10.2"
          envs: GO_VERSION
          custom-shell-name: bsd
          prepare: |
            set -ex
            mkdir -p /var/tmp
            chmod 1777 /var/tmp
            archive="go${GO_VERSION}.netbsd-amd64.tar.gz"
            ftp -o "/var/tmp/$archive" "https://go.dev/dl/$archive"
            tar -C /var/tmp -xzf "/var/tmp/$archive"
            useradd -m -s /bin/sh fsutil
      -
        name: Set up OpenBSD
        if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945 # v1.4.8
        with:
          release: "7.9"
          envs: GO_VERSION
          custom-shell-name: bsd
          prepare: |
            set -ex
            mkdir -p /var/tmp
            chmod 1777 /var/tmp
            archive="go${GO_VERSION}.openbsd-amd64.tar.gz"
            ftp -o "/var/tmp/$archive" "https://go.dev/dl/$archive"
            tar -C /var/tmp -xzf "/var/tmp/$archive"
            useradd -m -s /bin/sh fsutil
      -
        name: Test
        run: |
          bsd /dev/stdin <<'EOF'
          set -ex
          chown -R fsutil "$GITHUB_WORKSPACE"
          su - fsutil -c '
            set -ex
            cd "$1"
            export TMPDIR=/var/tmp
            export PATH="/var/tmp/go/bin:$PATH"
            go test -buildvcs=false -coverprofile=coverage.txt -covermode=atomic ./...
          ' sh "$GITHUB_WORKSPACE"
          EOF
      -
        name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt
          flags: unit,${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
